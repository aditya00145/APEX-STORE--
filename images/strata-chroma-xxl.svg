<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="100%" height="100%">
  <defs>
    <radialGradient id="mp-bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#141a16"/>
      <stop offset="60%" stop-color="#0c0f0d"/>
      <stop offset="100%" stop-color="#060807"/>
    </radialGradient>
    <linearGradient id="chroma-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff0000"/>
      <stop offset="20%" stop-color="#ff9900"/>
      <stop offset="40%" stop-color="#00ff00"/>
      <stop offset="60%" stop-color="#00ffff"/>
      <stop offset="80%" stop-color="#0066ff"/>
      <stop offset="100%" stop-color="#ff00ff"/>
    </linearGradient>
    <linearGradient id="mp-surface" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e2220"/>
      <stop offset="50%" stop-color="#131514"/>
      <stop offset="100%" stop-color="#0a0c0b"/>
    </linearGradient>
    <filter id="mp-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="mp-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#000000" flood-opacity="0.9"/>
    </filter>
  </defs>
  <rect width="640" height="640" fill="url(#mp-bg)"/>
  <ellipse cx="320" cy="510" rx="270" ry="24" fill="#000" opacity="0.8" filter="blur(16px)"/>
  
  <!-- Desk Pad (XXL Extended Width) -->
  <g transform="translate(30, 160)" filter="url(#mp-shadow)">
    <!-- Chroma 360 RGB Glow Edge -->
    <rect x="0" y="0" width="580" height="280" rx="16" fill="none" stroke="url(#chroma-border)" stroke-width="8" filter="url(#mp-glow)"/>
    <rect x="0" y="0" width="580" height="280" rx="16" fill="none" stroke="url(#chroma-border)" stroke-width="4"/>
    
    <!-- Micro-textured Cloth Mat Surface -->
    <rect x="5" y="5" width="570" height="270" rx="12" fill="url(#mp-surface)"/>
    
    <!-- Subtle Cloth Texture pattern lines -->
    <line x1="10" y1="70" x2="570" y2="70" stroke="#252a27" stroke-width="0.5" stroke-dasharray="2 4"/>
    <line x1="10" y1="140" x2="570" y2="140" stroke="#252a27" stroke-width="0.5" stroke-dasharray="2 4"/>
    <line x1="10" y1="210" x2="570" y2="210" stroke="#252a27" stroke-width="0.5" stroke-dasharray="2 4"/>
    
    <!-- Top-Left Cable Hub -->
    <rect x="18" y="16" width="34" height="20" rx="5" fill="#0d0e0f" stroke="#33373b" stroke-width="1"/>
    <circle cx="35" cy="26" r="3" fill="#00ff00"/>
    <path d="M 35 16 L 35 0" stroke="#33373b" stroke-width="2"/>
    
    <!-- Razer Triple-Headed Snake Logo Watermark -->
    <g transform="translate(500, 210) scale(0.65)" opacity="0.85">
      <path d="M 0 0 C 15 -25 35 -15 45 5 C 25 15 15 35 0 50 C -15 35 -25 15 -45 5 C -35 -15 -15 -25 0 0 Z" fill="#00ff00"/>
      <path d="M -15 -5 C -8 -20 8 -20 15 -5 C 0 10 -15 -5 -15 -5 Z" fill="#00ff00"/>
    </g>
    
    <!-- Central Spec Typography -->
    <text x="290" y="130" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="22" font-weight="800" fill="#ffffff" letter-spacing="6" text-anchor="middle">RAZER STRATA CHROMA</text>
    <text x="290" y="155" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="13" font-weight="600" fill="#00ff00" letter-spacing="3" text-anchor="middle">XXL EXTENDED GAMING DESK MAT</text>
    <text x="290" y="180" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="11" fill="#758278" letter-spacing="1" text-anchor="middle">940 × 410mm · 360° Razer Chroma RGB Underglow</text>
  </g>
</svg>