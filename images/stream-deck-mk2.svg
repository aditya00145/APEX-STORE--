<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="100%" height="100%">
  <defs>
    <radialGradient id="sd-bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#182338"/>
      <stop offset="60%" stop-color="#0f1624"/>
      <stop offset="100%" stop-color="#070b12"/>
    </radialGradient>
    <linearGradient id="sd-body" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a303c"/>
      <stop offset="100%" stop-color="#14171d"/>
    </linearGradient>
    <linearGradient id="key-glow1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <linearGradient id="key-glow2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff0844"/>
      <stop offset="100%" stop-color="#ffb199"/>
    </linearGradient>
    <linearGradient id="key-glow3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f857a6"/>
      <stop offset="100%" stop-color="#ff5858"/>
    </linearGradient>
    <linearGradient id="key-glow4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#43e97b"/>
      <stop offset="100%" stop-color="#38f9d7"/>
    </linearGradient>
    <linearGradient id="key-glow5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fa709a"/>
      <stop offset="100%" stop-color="#fee140"/>
    </linearGradient>
    <filter id="sd-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000000" flood-opacity="0.9"/>
    </filter>
  </defs>
  <rect width="640" height="640" fill="url(#sd-bg)"/>
  <ellipse cx="320" cy="510" rx="230" ry="24" fill="#000" opacity="0.75" filter="blur(16px)"/>
  
  <!-- Stream Deck MK.2 Console angled -->
  <g transform="translate(85, 120)" filter="url(#sd-shadow)">
    <!-- Stand / Bevel base -->
    <polygon points="15,360 455,360 470,390 0,390" fill="#0d0f14"/>
    <!-- Console Faceplate -->
    <rect x="10" y="0" width="450" height="350" rx="22" fill="url(#sd-body)" stroke="#4a5263" stroke-width="1.8"/>
    
    <!-- Elgato Logo / Header -->
    <circle cx="235" cy="30" r="12" fill="#00f2fe" opacity="0.85"/>
    <text x="235" y="34" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="11" font-weight="900" fill="#0a121e" text-anchor="middle">::</text>
    <text x="235" y="55" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="11" font-weight="700" fill="#8ea2be" letter-spacing="3" text-anchor="middle">STREAM DECK MK.2</text>
    
    <!-- 15 LCD Keys (5 columns x 3 rows) -->
    <!-- Row 1 -->
    <rect x="40"  y="75" width="68" height="68" rx="10" fill="url(#key-glow1)" stroke="#ffffff" stroke-width="1.2" opacity="0.95"/>
    <text x="74" y="115" font-family="sans-serif" font-size="20" fill="#061224" text-anchor="middle">LIVE</text>
    <rect x="120" y="75" width="68" height="68" rx="10" fill="url(#key-glow2)" stroke="#ffffff" stroke-width="1.2" opacity="0.95"/>
    <text x="154" y="115" font-family="sans-serif" font-size="22" fill="#fff" text-anchor="middle">● REC</text>
    <rect x="200" y="75" width="68" height="68" rx="10" fill="url(#key-glow3)" stroke="#ffffff" stroke-width="1.2" opacity="0.95"/>
    <text x="234" y="115" font-family="sans-serif" font-size="24" fill="#fff" text-anchor="middle">MIC</text>
    <rect x="280" y="75" width="68" height="68" rx="10" fill="url(#key-glow4)" stroke="#ffffff" stroke-width="1.2" opacity="0.95"/>
    <text x="314" y="115" font-family="sans-serif" font-size="24" fill="#062215" text-anchor="middle">VOL</text>
    <rect x="360" y="75" width="68" height="68" rx="10" fill="url(#key-glow5)" stroke="#ffffff" stroke-width="1.2" opacity="0.95"/>
    <text x="394" y="115" font-family="sans-serif" font-size="22" fill="#220b12" text-anchor="middle">CAM</text>
    
    <!-- Row 2 -->
    <rect x="40"  y="158" width="68" height="68" rx="10" fill="#1b2433" stroke="#2e3d54" stroke-width="1.5"/>
    <text x="74" y="198" font-family="sans-serif" font-size="14" font-weight="700" fill="#4facfe" text-anchor="middle">SCENE 1</text>
    <rect x="120" y="158" width="68" height="68" rx="10" fill="#1b2433" stroke="#2e3d54" stroke-width="1.5"/>
    <text x="154" y="198" font-family="sans-serif" font-size="14" font-weight="700" fill="#4facfe" text-anchor="middle">SCENE 2</text>
    <rect x="200" y="158" width="68" height="68" rx="10" fill="#1b2433" stroke="#2e3d54" stroke-width="1.5"/>
    <text x="234" y="198" font-family="sans-serif" font-size="14" font-weight="700" fill="#4facfe" text-anchor="middle">BRB</text>
    <rect x="280" y="158" width="68" height="68" rx="10" fill="#1b2433" stroke="#2e3d54" stroke-width="1.5"/>
    <text x="314" y="198" font-family="sans-serif" font-size="14" font-weight="700" fill="#ff5858" text-anchor="middle">SFX 1</text>
    <rect x="360" y="158" width="68" height="68" rx="10" fill="#1b2433" stroke="#2e3d54" stroke-width="1.5"/>
    <text x="394" y="198" font-family="sans-serif" font-size="14" font-weight="700" fill="#ff5858" text-anchor="middle">SFX 2</text>
    
    <!-- Row 3 -->
    <rect x="40"  y="241" width="68" height="68" rx="10" fill="url(#key-glow4)" stroke="#ffffff" stroke-width="1.2" opacity="0.9"/>
    <text x="74" y="281" font-family="sans-serif" font-size="20" fill="#042012" text-anchor="middle">DISC</text>
    <rect x="120" y="241" width="68" height="68" rx="10" fill="url(#key-glow1)" stroke="#ffffff" stroke-width="1.2" opacity="0.9"/>
    <text x="154" y="281" font-family="sans-serif" font-size="20" fill="#03162b" text-anchor="middle">SPOT</text>
    <rect x="200" y="241" width="68" height="68" rx="10" fill="#1b2433" stroke="#2e3d54" stroke-width="1.5"/>
    <text x="234" y="281" font-family="sans-serif" font-size="14" fill="#a0b3cc" text-anchor="middle">CLIP</text>
    <rect x="280" y="241" width="68" height="68" rx="10" fill="#1b2433" stroke="#2e3d54" stroke-width="1.5"/>
    <text x="314" y="281" font-family="sans-serif" font-size="14" fill="#a0b3cc" text-anchor="middle">TWITCH</text>
    <rect x="360" y="241" width="68" height="68" rx="10" fill="#1b2433" stroke="#2e3d54" stroke-width="1.5"/>
    <text x="394" y="281" font-family="sans-serif" font-size="14" fill="#a0b3cc" text-anchor="middle">STATS</text>
  </g>
</svg>